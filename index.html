<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DPS Biratnagar — Voting System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --paper: #fff4d6; --paper-2: #ffe9b3; --paper-3: #fffbe9; --paper-4: #ffffff;
  --ink: #1a1f6b; --ink-2: #2c3592; --ink-3: #555a85; --ink-4: #8a8eb2;
  --rule: #1a1f6b; --stamp: #e02538; --stamp-2: #b81b2c; --stamp-3: #ff3a4d;
  --seal: #f5a524; --seal-2: #d4881a; --tick: #11904a; --tick-2: #0b6c37;
  --accent-saffron: #ffa322; --accent-magenta: #c0306d; --accent-emerald: #11904a;
  --accent-sky: #2e86c1; --accent-violet: #6d3aa3;
  --shadow-sm: 0 1px 0 rgba(26,31,107,0.1);
  --shadow: 0 2px 0 rgba(26,31,107,0.12), 0 10px 28px rgba(26,31,107,0.14);
  --shadow-lg: 0 3px 0 rgba(26,31,107,0.14), 0 24px 56px rgba(26,31,107,0.22);
  --serif: "DM Serif Display","Source Serif 4",Georgia,serif;
  --serif-text: "Source Serif 4","DM Serif Display",Georgia,serif;
  --sans: "IBM Plex Sans",system-ui,sans-serif;
  --mono: "IBM Plex Mono",ui-monospace,monospace;
}
* { box-sizing: border-box; }
html,body { margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; -webkit-font-smoothing:antialiased; }
body {
  background:
    radial-gradient(ellipse 900px 700px at 18% -10%,rgba(255,163,34,0.22),transparent 60%),
    radial-gradient(ellipse 800px 600px at 100% 100%,rgba(224,37,56,0.14),transparent 60%),
    radial-gradient(ellipse 700px 500px at 10% 80%,rgba(46,134,193,0.12),transparent 60%),
    radial-gradient(ellipse 600px 400px at 90% 30%,rgba(192,48,109,0.10),transparent 65%),
    var(--paper);
  background-attachment:fixed; min-height:100vh;
}
body::before {
  content:""; position:fixed; inset:0; pointer-events:none;
  background-image:
    radial-gradient(circle at 12% 18%,var(--accent-saffron) 3px,transparent 4px),
    radial-gradient(circle at 88% 12%,var(--stamp) 2.5px,transparent 3.5px),
    radial-gradient(circle at 22% 78%,var(--accent-emerald) 2.5px,transparent 3.5px),
    radial-gradient(circle at 78% 88%,var(--accent-violet) 3px,transparent 4px),
    radial-gradient(circle at 50% 6%,var(--accent-magenta) 2px,transparent 3px),
    radial-gradient(circle at 6% 50%,var(--accent-sky) 2.5px,transparent 3.5px),
    radial-gradient(circle at 94% 50%,var(--seal) 2.5px,transparent 3.5px),
    radial-gradient(circle at 1px 1px,rgba(26,31,107,0.04) 1px,transparent 1.5px);
  background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,18px 18px;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,repeat;
  opacity:0.55; z-index:0;
}
body::after {
  content:""; position:fixed; inset:0; pointer-events:none;
  background-image:repeating-linear-gradient(115deg,transparent 0 60px,rgba(26,31,107,0.04) 60px 61px,transparent 61px 120px,rgba(224,37,56,0.04) 120px 121px,transparent 121px 180px,rgba(17,144,74,0.04) 180px 181px);
  z-index:0;
}
#root { position:relative; z-index:1; min-height:100vh; }
h1,h2,h3,h4 { font-family:var(--serif); font-weight:400; margin:0; letter-spacing:-0.015em; }
.letterhead { border-bottom:3px double var(--rule); padding:22px 36px 20px; display:flex; align-items:center; justify-content:space-between; gap:24px; background:linear-gradient(180deg,var(--paper-4) 0%,var(--paper-3) 100%); position:relative; }
.letterhead::after { content:""; position:absolute; left:0; right:0; bottom:-7px; height:7px; background:linear-gradient(90deg,var(--stamp) 0 14.28%,var(--accent-saffron) 14.28% 28.57%,var(--seal) 28.57% 42.85%,var(--accent-emerald) 42.85% 57.14%,var(--accent-sky) 57.14% 71.42%,var(--ink-2) 71.42% 85.71%,var(--accent-magenta) 85.71% 100%); box-shadow:0 1px 0 rgba(0,0,0,0.1); }
.letterhead-left { display:flex; align-items:center; gap:18px; }
.letterhead h1 { font-size:28px; line-height:1; }
.letterhead .sub { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.22em; color:var(--ink-2); margin-top:7px; display:flex; align-items:center; gap:8px; }
.letterhead .sub::before { content:""; width:18px; height:1px; background:var(--stamp); }
.letterhead-right { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.18em; color:var(--ink-2); text-align:right; }
.stage { max-width:920px; margin:0 auto; padding:36px 24px 80px; position:relative; }
.stage-wide { max-width:1320px; margin:0 auto; padding:28px 28px 80px; }
.sheet { background:linear-gradient(180deg,var(--paper-4) 0%,var(--paper-3) 100%); border:2px solid var(--rule); border-radius:2px; position:relative; box-shadow:var(--shadow); }
.sheet::before { content:""; position:absolute; inset:8px; border:1px solid var(--rule); pointer-events:none; opacity:0.7; }
.sheet::after { content:""; position:absolute; inset:14px; border:1px dashed rgba(20,33,61,0.18); pointer-events:none; }
.sheet-inner { padding:44px 48px; position:relative; z-index:1; }
.corner { position:absolute; width:38px; height:38px; color:var(--ink); opacity:0.85; z-index:2; pointer-events:none; }
.corner.tl{top:4px;left:4px}.corner.tr{top:4px;right:4px;transform:scaleX(-1)}.corner.bl{bottom:4px;left:4px;transform:scaleY(-1)}.corner.br{bottom:4px;right:4px;transform:scale(-1,-1)}
.sheet-title { display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:30px; text-align:center; }
.sheet-title .eyebrow { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.28em; color:var(--stamp); display:inline-flex; align-items:center; gap:12px; }
.sheet-title .eyebrow::before,.sheet-title .eyebrow::after { content:""; width:22px; height:1px; background:var(--stamp); opacity:0.6; }
.sheet-title h2 { font-size:46px; line-height:1.02; }
.sheet-title .desc { font-family:var(--serif-text); color:var(--ink-2); max-width:560px; font-size:16px; font-style:italic; margin-top:8px; line-height:1.45; }
.rule-orn { display:flex; align-items:center; gap:12px; color:var(--ink); margin:18px 0 28px; }
.rule-orn::before,.rule-orn::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--ink) 30%,var(--ink) 70%,transparent); }
.rule-orn .dot { width:10px; height:10px; transform:rotate(45deg); background:var(--ink); position:relative; }
.rule-orn .dot::before,.rule-orn .dot::after { content:""; position:absolute; top:50%; width:6px; height:1px; background:var(--ink); }
.rule-orn .dot::before{right:14px}.rule-orn .dot::after{left:14px}
.field { display:flex; flex-direction:column; gap:8px; }
.field label { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.22em; color:var(--ink-2); display:inline-flex; align-items:center; gap:8px; }
.field label::before { content:""; width:6px; height:6px; background:var(--stamp); transform:rotate(45deg); display:inline-block; }
.input { width:100%; background:var(--paper-4); border:1.5px solid var(--rule); padding:14px 16px; font-family:var(--serif-text); font-size:17px; color:var(--ink); border-radius:2px; outline:none; transition:box-shadow 120ms,background 120ms; }
.input:focus { background:#fff; box-shadow:0 0 0 3px rgba(20,33,61,0.18),inset 0 0 0 1px var(--ink); }
select.input { font-family:var(--sans); font-weight:500; }
.row { display:grid; gap:22px; }
.row-2 { grid-template-columns:1fr 1fr; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:14px 24px; font-family:var(--mono); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.22em; border:1.5px solid var(--ink); background:var(--paper-4); color:var(--ink); cursor:pointer; border-radius:2px; transition:all 140ms; }
.btn:hover { background:var(--ink); color:var(--paper-4); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.btn:active { transform:translateY(0); }
.btn-primary { background:var(--ink); color:var(--paper-4); box-shadow:0 2px 0 var(--ink-2); }
.btn-primary:hover { background:var(--stamp); border-color:var(--stamp); box-shadow:0 2px 0 var(--stamp-2); }
.btn-stamp { background:var(--stamp); color:var(--paper-4); border-color:var(--stamp); box-shadow:0 2px 0 var(--stamp-2); }
.btn-stamp:hover { background:var(--stamp-2); border-color:var(--stamp-2); }
.btn-ghost { border-color:transparent; background:transparent; box-shadow:none; }
.btn-ghost:hover { background:transparent; color:var(--stamp); transform:none; box-shadow:none; }
.btn:disabled { opacity:0.35; cursor:not-allowed; }
.btn:disabled:hover { background:var(--paper-4); color:var(--ink); transform:none; box-shadow:none; }
.btn-primary:disabled:hover { background:var(--ink); color:var(--paper-4); }
.btn-sm { padding:10px 16px; font-size:10px; letter-spacing:0.18em; }
.house-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
.house-card { border:2px solid var(--rule); background:var(--paper-4); padding:24px 26px; display:flex; align-items:center; gap:20px; cursor:pointer; transition:all 160ms; text-align:left; font-family:inherit; color:inherit; border-radius:2px; position:relative; overflow:hidden; }
.house-card::before { content:""; position:absolute; inset:6px; border:1px solid var(--rule); pointer-events:none; opacity:0.35; }
.house-card::after { content:""; position:absolute; top:-40px; right:-40px; width:120px; height:120px; border-radius:50%; background:var(--house-color,var(--ink)); opacity:0.08; pointer-events:none; transition:all 240ms; }
.house-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--house-color,var(--ink)); }
.house-card:hover::after { opacity:0.16; transform:scale(1.15); }
.house-card.selected { background:var(--house-color,var(--ink)); color:var(--paper-4); border-color:var(--house-color,var(--ink)); }
.house-card.selected::before { border-color:var(--paper-4); opacity:0.4; }
.house-card.selected .house-meta { color:rgba(255,255,255,0.82); }
.house-card.selected .house-swatch { border-color:var(--paper-4); }
.house-swatch { width:72px; height:72px; border-radius:50%; border:3px solid var(--ink); flex-shrink:0; background:radial-gradient(circle at 30% 25%,rgba(255,255,255,0.45),transparent 50%),var(--house-color,var(--ink)); box-shadow:inset 0 -10px 18px rgba(0,0,0,0.25),0 4px 12px rgba(0,0,0,0.15); }
.house-name { font-family:var(--serif); font-size:32px; line-height:1; }
.house-meta { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.22em; color:var(--ink-3); margin-top:8px; }
.ballot-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.candidate-card { border:2px solid var(--rule); background:var(--paper-4); padding:0; cursor:pointer; display:grid; grid-template-columns:78px 1fr 76px; align-items:stretch; transition:all 160ms; text-align:left; font-family:inherit; color:inherit; border-radius:2px; overflow:hidden; position:relative; min-height:96px; }
.candidate-card:hover { background:#fff; transform:translateY(-1px); box-shadow:var(--shadow); border-color:var(--sl-color,var(--ink)); }
.candidate-card.selected { border-color:var(--sl-color,var(--ink)); box-shadow:0 0 0 3px var(--sl-color,var(--ink)) inset,0 0 0 6px var(--paper-4) inset,var(--shadow); }
.candidate-card:nth-child(6n+1){--sl-color:var(--stamp)}.candidate-card:nth-child(6n+2){--sl-color:var(--accent-emerald)}.candidate-card:nth-child(6n+3){--sl-color:var(--accent-saffron)}.candidate-card:nth-child(6n+4){--sl-color:var(--accent-sky)}.candidate-card:nth-child(6n+5){--sl-color:var(--accent-magenta)}.candidate-card:nth-child(6n+6){--sl-color:var(--accent-violet)}
.candidate-sl { background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(255,255,255,0.08) 6px 7px),var(--sl-color,var(--ink)); color:var(--paper-4); display:grid; place-items:center; font-family:var(--mono); font-size:24px; font-weight:600; position:relative; }
.candidate-sl::after { content:""; position:absolute; right:-1px; top:8px; bottom:8px; width:2px; background-image:radial-gradient(circle,var(--paper-4) 1px,transparent 1.5px); background-size:2px 6px; }
.candidate-body { padding:16px 18px; display:flex; flex-direction:column; justify-content:center; gap:6px; min-width:0; }
.candidate-name { font-family:var(--serif); font-size:26px; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.candidate-meta { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.22em; color:var(--ink-3); display:inline-flex; align-items:center; gap:8px; }
.candidate-meta::before { content:""; width:16px; height:1px; background:var(--ink-3); }
.candidate-symbol { border-left:1.5px solid var(--rule); background:radial-gradient(circle at center,var(--paper-4) 50%,transparent 50%) 0 0/8px 8px,var(--paper-3); display:grid; place-items:center; padding:10px; }
.candidate-symbol svg { width:42px; height:42px; color:var(--sl-color,var(--ink)); }
.candidate-card.selected .candidate-symbol { background:radial-gradient(circle at center,var(--paper-4) 50%,transparent 50%) 0 0/8px 8px,color-mix(in srgb,var(--sl-color) 12%,var(--paper-3)); }
.tick-stamp { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-14deg); width:160px; height:160px; border:5px double var(--tick); border-radius:50%; display:grid; place-items:center; color:var(--tick); font-family:var(--mono); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.22em; text-align:center; background:rgba(31,111,67,0.04); pointer-events:none; opacity:0; animation:stampIn 320ms cubic-bezier(.2,.8,.2,1) forwards; z-index:3; }
.candidate-card.selected .tick-stamp { opacity:1; }
@keyframes stampIn { 0%{transform:translate(-50%,-50%) rotate(-40deg) scale(2);opacity:0} 50%{opacity:0.95} 100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1} }
.stepper { display:flex; align-items:center; border:1.5px solid var(--rule); background:var(--paper-4); padding:5px; margin-bottom:26px; overflow:hidden; border-radius:2px; box-shadow:var(--shadow-sm); }
.stepper-item { flex:1; padding:10px; font-family:var(--mono); font-size:9px; font-weight:500; text-transform:uppercase; letter-spacing:0.18em; text-align:center; color:var(--ink-3); border-right:1px dashed rgba(20,33,61,0.25); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:all 160ms; }
.stepper-item:last-child{border-right:none}
.stepper-item.done{color:var(--tick);background:rgba(31,111,67,0.06)}
.stepper-item.active{color:var(--paper-4);background:var(--ink);font-weight:600}
.admin-shell { display:grid; grid-template-columns:260px 1fr; gap:28px; margin-top:28px; }
.admin-nav { border:2px solid var(--rule); background:linear-gradient(180deg,var(--paper-4),var(--paper-3)); padding:8px; align-self:start; position:sticky; top:18px; border-radius:2px; box-shadow:var(--shadow-sm); }
.admin-nav button { display:flex; align-items:center; width:100%; text-align:left; background:transparent; border:none; padding:13px 16px; font-family:var(--mono); font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.18em; color:var(--ink-2); cursor:pointer; border-left:3px solid transparent; transition:all 120ms; }
.admin-nav button:hover{color:var(--ink);background:rgba(20,33,61,0.04)}
.admin-nav button.active{background:var(--paper-4);color:var(--ink);border-left-color:var(--nav-accent,var(--stamp));font-weight:600;box-shadow:inset 0 0 0 1px rgba(26,31,107,0.08)}
.admin-nav button:nth-of-type(1).active{--nav-accent:var(--stamp)}.admin-nav button:nth-of-type(2).active{--nav-accent:var(--accent-emerald)}.admin-nav button:nth-of-type(3).active{--nav-accent:var(--accent-saffron)}.admin-nav button:nth-of-type(4).active{--nav-accent:var(--accent-magenta)}.admin-nav button:nth-of-type(5).active{--nav-accent:var(--accent-sky)}.admin-nav button:nth-of-type(6).active{--nav-accent:var(--accent-violet)}.admin-nav button:nth-of-type(7).active{--nav-accent:var(--stamp)}
.admin-nav-section { font-family:var(--mono); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.24em; color:var(--ink-4); padding:16px 16px 8px; display:flex; align-items:center; gap:8px; }
.admin-nav-section::after{content:"";flex:1;height:1px;background:rgba(20,33,61,0.15)}
.admin-panel { background:linear-gradient(180deg,var(--paper-4),var(--paper-3)); border:2px solid var(--rule); padding:32px 36px; border-radius:2px; min-height:600px; box-shadow:var(--shadow); position:relative; }
.admin-panel::before{content:"";position:absolute;inset:8px;border:1px solid var(--rule);pointer-events:none;opacity:0.4}
.admin-panel>*{position:relative;z-index:1}
.admin-h { display:flex; align-items:end; justify-content:space-between; border-bottom:3px double var(--rule); padding-bottom:18px; margin-bottom:26px; gap:16px; }
.admin-h h2{font-size:34px}
.admin-h .desc{color:var(--ink-2);font-size:11px;margin-top:6px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.22em;display:inline-flex;align-items:center;gap:8px}
.admin-h .desc::before{content:"";width:18px;height:1px;background:var(--stamp)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat{border:1.5px solid var(--rule);background:var(--paper-4);padding:18px 20px;border-radius:2px;position:relative;overflow:hidden;border-top:5px solid var(--stat-accent,var(--ink))}
.stat:nth-child(1){--stat-accent:var(--stamp)}.stat:nth-child(2){--stat-accent:var(--accent-emerald)}.stat:nth-child(3){--stat-accent:var(--accent-saffron)}.stat:nth-child(4){--stat-accent:var(--accent-sky)}
.stat::before{content:"";position:absolute;inset:5px;border:1px dashed rgba(26,31,107,0.15);pointer-events:none}
.stat>*{position:relative;z-index:1}
.stat .label{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.22em;color:var(--ink-3)}
.stat .val{font-family:var(--serif);font-size:52px;line-height:1.02;margin-top:6px;color:var(--stat-accent,var(--ink))}
.stat .sub{font-family:var(--mono);font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.2em;margin-top:4px}
.table{width:100%;border-collapse:collapse;font-size:14px;border:1.5px solid var(--rule);background:var(--paper-4)}
.table th{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.22em;color:var(--ink-3);text-align:left;padding:12px 14px;border-bottom:1.5px solid var(--rule);background:var(--paper-2)}
.table td{padding:14px;border-bottom:1px dashed rgba(20,33,61,0.18);vertical-align:middle}
.table tr:last-child td{border-bottom:none}.table tr:hover td{background:rgba(20,33,61,0.03)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--rule);background:var(--paper-4);font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.18em;border-radius:2px}
.chip-dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.chip.stamp{color:var(--stamp);border-color:var(--stamp);background:rgba(139,31,47,0.05)}.chip.stamp .chip-dot{background:var(--stamp)}
.chip.tick{color:var(--tick);border-color:var(--tick);background:rgba(31,111,67,0.06)}.chip.tick .chip-dot{background:var(--tick);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.bar-row{display:grid;grid-template-columns:38px 46px 1fr 90px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px dashed rgba(20,33,61,0.18)}
.bar-row:last-child{border-bottom:none}
.bar-sl{font-family:var(--mono);color:var(--ink-3);font-size:12px;font-weight:600}
.bar-symbol{display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--bar-color,var(--rule));background:var(--paper-4);border-radius:2px;color:var(--bar-color,var(--ink))}
.bar-name{display:flex;flex-direction:column;gap:5px;min-width:0}
.bar-name .nm{font-family:var(--serif);font-size:20px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

);

// ─── Admin Lock ───────────────────────────────────────────────────────────────
const AdminLock = ({ onUnlock }) => {
  const [pw,setPw]=useState(""); const [show,setShow]=useState(false); const [err,setErr]=useState(false); const [shake,setShake]=useState(false);
  const inputRef=useRef(null);
  useEffect(()=>{ setTimeout(()=>inputRef.current?.focus(),60); },[]);
  const submit = async () => {
    const { data } = await sb.from("settings").select("value").eq("key","admin_password").single();
    const expected = data?.value || "dps2026";
    if (pw===expected) { onUnlock(); }
    else { setErr(true); setShake(true); setTimeout(()=>setShake(false),380); setPw(""); inputRef.current?.focus(); }
  };
  return (
    <div className="welcome">
      <div className={"welcome-card lock-card"+(shake?" lock-shake":"")}>
        <SheetCorners/><Watermark text="RETURNING OFFICER \u00b7 SECURE ACCESS"/>
        <div className="lock-inner">
          <div className="lock-icon"><svg viewBox="0 0 32 32" width="36" height="36" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="14" width="20" height="14" rx="2"/><path d="M10 14V10a6 6 0 0 1 12 0v4"/><circle cx="16" cy="21" r="1.5" fill="currentColor"/><path d="M16 22.5v2.5"/></svg></div>
          <div className="welcome-eyebrow">Restricted Access</div>
          <h1 style={{fontSize:36,marginTop:14}}>Returning Officer<br/>Authentication</h1>
          <p className="scroll" style={{fontSize:15,marginTop:14}}>This booth is reserved for the Election Commissioner.<br/>Enter the polling station passcode to continue.</p>
          <RuleOrn/>
          <div className="field" style={{alignItems:"stretch"}}>
            <label style={{justifyContent:"center"}}>Passcode</label>
            <input ref={inputRef} className="input lock-pw-input" type={show?"text":"password"} value={pw} onChange={e=>{setPw(e.target.value);setErr(false);}} onKeyDown={e=>{if(e.key==="Enter")submit();}} placeholder="\u2022\u2022\u2022\u2022\u2022\u2022"/>
            {err&&<div className="lock-err"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16v.5"/></svg>Incorrect passcode \u00b7 access denied</div>}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:20,gap:12}}>
            <button className="btn-ghost btn btn-sm" onClick={()=>setShow(s=>!s)} style={{padding:"6px 0"}}>{show?"Hide":"Show"} passcode</button>
            <button className="btn btn-stamp" onClick={submit} disabled={!pw}>Authenticate \u2192</button>
          </div>
          <div className="lock-hint"><span style={{width:6,height:6,borderRadius:"50%",background:"var(--seal)"}}/>Default passcode: <strong style={{color:"var(--ink)",letterSpacing:"0.18em"}}>dps2026</strong></div>
        </div>
      </div>
    </div>
  );
};

// ─── Student Flow ─────────────────────────────────────────────────────────────
const StudentApp = ({ candidates, houses, classes, votingOpen, onSubmitVote, checkHasVoted }) => {
  const [step,setStep]=useState("welcome");
  const [name,setName]=useState(""); const [klass,setKlass]=useState(""); const [house,setHouse]=useState(null);
  const [picks,setPicks]=useState({}); const [roleIdx,setRoleIdx]=useState(0); const [submitting,setSubmitting]=useState(false);

  const stepperSteps=["Identity","House",...ROLES.map(r=>r.gender?`${r.label} (${r.gender[0]})`:r.label)];
  const stepperIndex=useMemo(()=>{
    if(step==="welcome"||step==="identity") return 0;
    if(step==="house") return 1;
    if(step.startsWith("vote:")) return 2+roleIdx;
    return stepperSteps.length;
  },[step,roleIdx]);

  const goToVote=idx=>{setRoleIdx(idx);setStep("vote:"+idx);};
  const currentRole=ROLES[roleIdx];
  const candidatesForCurrent=useMemo(()=>{
    if(!currentRole) return [];
    return candidates.filter(c=>{
      if(c.role!==currentRole.id) return false;
      if(currentRole.gender&&c.gender!==currentRole.gender) return false;
      if(currentRole.scope==="house"&&c.house!==house) return false;
      if(currentRole.scope==="class"&&c.class!==klass) return false;
      return true;
    });
  },[candidates,currentRole,house,klass]);

  const handleIdentityNext=async()=>{
    if(!name.trim()||!klass) return;
    const already=await checkHasVoted(name.trim(),klass);
    if(already){setStep("blocked");return;}
    setStep("house");
  };

  const handleVoteNext=async()=>{
    if(!picks[currentRole.id]) return;
    if(roleIdx<ROLES.length-1){goToVote(roleIdx+1);}
    else{
      setSubmitting(true);
      await onSubmitVote({voter_name:name.trim(),class:klass,house,picks,ts:Date.now()});
      setSubmitting(false);
      setStep("done");
    }
  };

  if(!votingOpen&&step==="welcome") return (
    <div className="welcome"><div className="welcome-card"><Watermark text="POLLS CLOSED"/>
      <div className="welcome-inner">
        <div className="welcome-eyebrow">Notice from the Returning Officer</div>
        <h1>Polling is currently closed.</h1>
        <p className="scroll">The voting window has not been opened by the Election Commissioner.</p>
      </div>
    </div></div>
  );

  if(step==="welcome") return (
    <div className="welcome"><div className="welcome-card"><Watermark/>
      <div className="welcome-inner">
        <div className="welcome-eyebrow">Office of the Returning Officer</div>
        <h1>Student Council<br/>Election &mdash; 2026</h1>
        <p className="scroll">You are about to enter an official ballot booth. Cast your votes with care &mdash;<br/>a single ballot will be issued per student, sealed upon submission.</p>
        <RuleOrn/>
        <div style={{display:"flex",justifyContent:"center",gap:12}}>
          <button className="btn btn-stamp" onClick={()=>setStep("identity")}>
            <svg className="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>Enter Polling Booth
          </button>
        </div>
        <div style={{marginTop:28,fontFamily:"var(--mono)",fontSize:10,textTransform:"uppercase",letterSpacing:"0.18em",color:"var(--ink-3)"}}>7 ballots · 4 houses · {classes.length} classes</div>
      </div>
    </div></div>
  );

  if(step==="blocked") return (
    <div className="stage"><div className="sheet"><SheetCorners/>
      <div className="sheet-inner" style={{textAlign:"center"}}>
        <div className="sheet-title"><div className="eyebrow">Ballot Refused</div><h2>You have already voted.</h2><p className="desc">Our records show <strong>{name}</strong> from class <strong>{klass}</strong> has already cast a ballot.</p></div>
        <RuleOrn/>
        <button className="btn btn-primary" onClick={()=>{setStep("identity");setName("");setKlass("");}}>← Return to Identity</button>
      </div>
    </div></div>
  );

  if(step==="done"){
    const receiptNo="DPS-"+Math.random().toString(36).slice(2,8).toUpperCase();
    const houseName=houses.find(h=>h.id===house)?.name;
    return (
      <div className="stage"><div className="sheet"><SheetCorners/>
        <div className="sheet-inner done-card">
          <div className="done-seal"><div className="done-seal-inner">Ballot<span className="big">Sealed</span>Verified</div></div>
          <div className="sheet-title"><div className="eyebrow">Receipt of Vote</div><h2>Thank you for voting.</h2><p className="desc">Your ballot has been recorded and sealed. The Returning Officer will publish results after polls close.</p></div>
          <RuleOrn/>
          <div className="receipt">
            <div className="lbl">Voter</div><div>{name}</div>
            <div className="lbl">Class</div><div>{klass}</div>
            <div className="lbl">House</div><div>{houseName}</div>
            <div className="lbl">Receipt No.</div><div>{receiptNo}</div>
            <div className="lbl">Issued At</div><div>{new Date().toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"})}</div>
          </div>
          <div style={{marginTop:28}}><button className="btn" onClick={()=>{setName("");setKlass("");setHouse(null);setPicks({});setRoleIdx(0);setStep("welcome");}}>Return to Welcome</button></div>
        </div>
      </div></div>
    );
  }

  return (
    <div className="stage">
      {submitting&&<LoadingOverlay msg="Sealing ballot…"/>}
      <Stepper steps={stepperSteps} currentIndex={stepperIndex}/>
      {step==="identity"&&(
        <div className="sheet"><SheetCorners/>
          <div className="sheet-inner">
            <div className="sheet-title"><div className="eyebrow">Form A — Voter Identification</div><h2>Identify yourself for the record.</h2><p className="desc">Your name and class will be sealed with your ballot. Use your full name as registered.</p></div>
            <RuleOrn/>
            <div className="row row-2">
              <div className="field"><label>Full Name</label><input className="input" placeholder="e.g. Aarav Sharma" value={name} onChange={e=>setName(e.target.value)} autoFocus/></div>
              <div className="field"><label>Class & Section</label>
                <select className="input" value={klass} onChange={e=>setKlass(e.target.value)}>
                  <option value="">Select your class</option>
                  {classes.map(c=><option key={c} value={c}>Class {c}</option>)}
                </select>
              </div>
            </div>
            <div style={{marginTop:22,paddingTop:18,borderTop:"1px dashed rgba(20,33,61,0.25)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <button className="btn btn-ghost" onClick={()=>setStep("welcome")}>← Cancel</button>
              <button className="btn btn-primary" onClick={handleIdentityNext} disabled={!name.trim()||!klass}>Proceed to House Selection →</button>
            </div>
          </div>
        </div>
      )}
      {step==="house"&&(
        <div className="sheet"><SheetCorners/>
          <div className="sheet-inner">
            <div className="sheet-title"><div className="eyebrow">Form B — House Affiliation</div><h2>Which house do you belong to?</h2><p className="desc">Your house determines which House Captain candidates appear on your ballot.</p></div>
            <RuleOrn/>
            <div className="house-grid">
              {houses.map(h=>(
                <button key={h.id} className={"house-card"+(house===h.id?" selected":"")} onClick={()=>setHouse(h.id)} style={{"--house-color":h.color}}>
                  <div className="house-swatch"/>
                  <div><div className="house-name">{h.name}</div><div className="house-meta">{h.description}</div></div>
                </button>
              ))}
            </div>
            <div style={{marginTop:28,paddingTop:18,borderTop:"1px dashed rgba(20,33,61,0.25)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <button className="btn btn-ghost" onClick={()=>setStep("identity")}>← Back</button>
              <button className="btn btn-primary" onClick={()=>{if(!house)return;goToVote(0);}} disabled={!house}>Begin Voting →</button>
            </div>
          </div>
        </div>
      )}
      {step.startsWith("vote:")&&currentRole&&(()=>{
        const sheetTitle=currentRole.gender?`${currentRole.label} — ${currentRole.gender}`:currentRole.label;
        const formNo=String.fromCharCode(67+roleIdx);
        const scopeBadge=currentRole.scope==="house"?<Chip variant="stamp">House: {houses.find(h=>h.id===house)?.name||"—"}</Chip>:currentRole.scope==="class"?<Chip variant="stamp">Class: {klass}</Chip>:<Chip>School-wide</Chip>;
        const picked=picks[currentRole.id]; const isLast=roleIdx===ROLES.length-1;
        return (
          <div className="sheet"><SheetCorners/>
            <div className="sheet-inner">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontFamily:"var(--mono)",fontSize:10,textTransform:"uppercase",letterSpacing:"0.22em",color:"var(--ink-3)",marginBottom:14}}>
                <span>Ballot {roleIdx+1} of {ROLES.length}</span>{scopeBadge}
              </div>
              <div className="sheet-title"><div className="eyebrow">Form {formNo} — Ballot Paper</div><h2>{sheetTitle}</h2><p className="desc">Select one candidate. Your selection is sealed when you proceed.</p></div>
              <RuleOrn/>
              {candidatesForCurrent.length===0?(
                <div className="empty"><h4>No candidates listed.</h4><p>The Returning Officer has not registered candidates for this role.</p></div>
              ):(
                <div className="ballot-grid">
                  {candidatesForCurrent.map((c,i)=>{
                    const symbolOnly=["sc","vc_b","vc_g","cc"].includes(currentRole.id);
                    const nameOnly=["hc","vhc_b","vhc_g","cp"].includes(currentRole.id);
                    return (
                      <button key={c.id} className={"candidate-card"+(picked===c.id?" selected":"")} onClick={()=>setPicks(p=>({...p,[currentRole.id]:c.id}))} style={symbolOnly?{gridTemplateColumns:"1fr"}:nameOnly?{gridTemplateColumns:"78px 1fr"}:{}}>
                        <div className="candidate-sl">{String(i+1).padStart(2,"0")}</div>
                        {symbolOnly?(
                          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"26px 16px",gap:12,minHeight:110}}>
                            <div style={{width:68,height:68,display:"grid",placeItems:"center",color:"var(--sl-color,var(--ink))"}}><BallotSymbol name={c.symbol}/></div>
                            <div style={{fontFamily:"var(--mono)",fontSize:10,textTransform:"uppercase",letterSpacing:"0.2em",color:"var(--ink-3)"}}>Candidate {String(i+1).padStart(2,"0")}</div>
                          </div>
                        ):(
                          <div className="candidate-body">
                            <div className="candidate-name">{c.name}</div>
                            <div className="candidate-meta">{currentRole.scope==="school"?"School Candidate":currentRole.scope==="house"?`${houses.find(h=>h.id===house)?.name} House`:`Class ${klass}`}</div>
                          </div>
                        )}
                        {!symbolOnly&&!nameOnly&&<div className="candidate-symbol"><BallotSymbol name={c.symbol}/></div>}
                        {picked===c.id&&<div className="tick-stamp"><div><div style={{fontSize:28,fontFamily:"var(--serif)",letterSpacing:0}}>✓</div><div style={{marginTop:4}}>Voted</div></div></div>}
                      </button>
                    );
                  })}
                </div>
              )}
              <div style={{marginTop:26,paddingTop:18,borderTop:"1px dashed rgba(20,33,61,0.25)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <button className="btn btn-ghost" onClick={()=>{if(roleIdx===0)setStep("house");else goToVote(roleIdx-1);}}>← Back</button>
                <button className={"btn "+(isLast?"btn-stamp":"btn-primary")} onClick={handleVoteNext} disabled={!picked}>{isLast?"Seal & Submit Ballot":"Confirm & Next Ballot →"}</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
};

const Candidates = ({ candidates, setCandidates, houses, classes }) => {
  const [filterRole,setFilterRole]=useState("all"); const [filterHouse,setFilterHouse]=useState("all"); const [search,setSearch]=useState(""); const [editing,setEditing]=useState(null); const [saving,setSaving]=useState(false);
  const filtered=candidates.filter(c=>(filterRole==="all"||c.role===filterRole)&&(filterHouse==="all"||c.house===filterHouse)&&(!search.trim()||c.name.toLowerCase().includes(search.trim().toLowerCase())));
  const handleSave=async(cand)=>{
    setSaving(true);
    const row={name:cand.name,role:cand.role,gender:cand.gender||null,house:cand.house||null,class:cand.class||null,symbol:cand.symbol,photo:cand.photo||null};
    if(cand.id){
      await sb.from("candidates").update(row).eq("id",cand.id);
      setCandidates(prev=>prev.map(p=>p.id===cand.id?{...p,...row}:p));
    } else {
      const id="c"+Date.now();
      await sb.from("candidates").insert({id,...row});
      setCandidates(prev=>[...prev,{id,...row}]);
    }
    setSaving(false); setEditing(null);
  };
  const handleDelete=async(id)=>{
    if(!confirm("Delete this candidate?")) return;
    await sb.from("candidates").delete().eq("id",id);
    setCandidates(prev=>prev.filter(p=>p.id!==id));
  };
  return (<>
    {saving&&<LoadingOverlay msg="Saving…"/>}
    <div className="admin-h"><div><h2>Candidate Register</h2><div className="desc">Add, edit, or strike off candidates.</div></div><button className="btn btn-primary" onClick={()=>setEditing({})}>+ Add Candidate</button></div>
    <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap",alignItems:"flex-end"}}>
      <div className="field" style={{flex:"1 1 200px"}}>
        <label>Search Candidate</label>
        <div style={{position:"relative"}}>
          <input className="input" placeholder="Type a name…" value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:40}}/>
          <svg style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",pointerEvents:"none",color:"var(--ink-3)"}} viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--ink-3)",fontSize:16,lineHeight:1}}>✕</button>}
        </div>
      </div>
      <div className="field"><label>Role</label><select className="input" value={filterRole} onChange={e=>setFilterRole(e.target.value)}><option value="all">All Roles</option>{ROLES.map(r=><option key={r.id} value={r.id}>{r.label}{r.gender?` (${r.gender})`:""}</option>)}</select></div>

const CandidateModal = ({ initial, houses, classes, onClose, onSave }) => {
  const [form,setForm]=useState({id:initial.id,name:initial.name||"",role:initial.role||"sc",gender:initial.gender||"Boy",house:initial.house||"",class:initial.class||"",symbol:initial.symbol||"star",photo:initial.photo||null});
  const [symbolTab,setSymbolTab]=useState(()=>(initial.symbol&&initial.symbol.startsWith("data:"))?"upload":"preset");
  const role=ROLES.find(r=>r.id===form.role);
  const needsHouse=role?.scope==="house",needsClass=role?.scope==="class",needsGender=!!role?.gender;
  useEffect(()=>{
    if(needsGender&&form.gender!==role.gender) setForm(f=>({...f,gender:role.gender}));
    if(!needsGender&&form.gender) setForm(f=>({...f,gender:null}));
    if(!needsHouse&&form.house) setForm(f=>({...f,house:""}));
    if(!needsClass&&form.class) setForm(f=>({...f,class:""}));
  },[form.role]);
  const handlePhoto=e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>setForm(f=>({...f,photo:reader.result}));reader.readAsDataURL(file);};
  const handleSymbolUpload=e=>{
    const file=e.target.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=evt=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=128;
        const scale=Math.min(1, MAX/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const png=canvas.toDataURL("image/png");
        setForm(f=>({...f,symbol:png}));
      };
      img.src=evt.target.result;
    };
    reader.readAsDataURL(file);
  };
  const clearSymbolUpload=()=>setForm(f=>({...f,symbol:"star"}));
  const isCustomSymbol=form.symbol&&form.symbol.startsWith("data:");
  const canSave=form.name.trim()&&(!needsHouse||form.house)&&(!needsClass||form.class);
  return (
    <Modal title={initial.id?"Edit Candidate":"Register New Candidate"} onClose={onClose} footer={(<><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" disabled={!canSave} onClick={()=>onSave(form)}>{initial.id?"Save Changes":"Register Candidate"}</button></>)}>
      <div style={{display:"grid",gridTemplateColumns:"150px 1fr",gap:22}}>
        <div><div className="field"><label>Photo (optional)</label><label className="image-slot" htmlFor="photo-input">{form.photo?<img src={form.photo} alt=""/>:<span>Tap to upload<br/>candidate photo</span>}</label><input id="photo-input" type="file" accept="image/*" onChange={handlePhoto} style={{display:"none"}}/></div></div>
        <div style={{display:"grid",gap:14}}>
          <div className="field"><label>Full Name</label><input className="input" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
          <div className="row row-2">
            <div className="field"><label>Role</label><select className="input" value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>{ROLES.map(r=><option key={r.id} value={r.id}>{r.label}{r.gender?` (${r.gender})`:""}</option>)}</select></div>
            <div className="field"><label>{needsHouse?"House":needsClass?"Class":"Scope"}</label>
              {needsHouse?(<select className="input" value={form.house} onChange={e=>setForm(f=>({...f,house:e.target.value}))}><option value="">Select House</option>{houses.map(h=><option key={h.id} value={h.id}>{h.name}</option>)}</select>)
              :needsClass?(<select className="input" value={form.class} onChange={e=>setForm(f=>({...f,class:e.target.value}))}><option value="">Select Class</option>{classes.map(c=><option key={c} value={c}>Class {c}</option>)}</select>)
              :(<input className="input" value="School-wide" disabled/>)}
            </div>
          </div>
        </div>
      </div>
      <div className="field" style={{marginTop:22}}>
        <label>Election Symbol</label>
        <div style={{display:"flex",gap:0,marginBottom:10,border:"1.5px solid var(--rule)",borderRadius:2,overflow:"hidden",width:"fit-content"}}>
          <button type="button" onClick={()=>setSymbolTab("preset")} style={{padding:"8px 18px",fontFamily:"var(--mono)",fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.18em",border:"none",cursor:"pointer",background:symbolTab==="preset"?"var(--ink)":"var(--paper-4)",color:symbolTab==="preset"?"var(--paper-4)":"var(--ink-3)",transition:"all 140ms"}}>Preset Symbols</button>
          <button type="button" onClick={()=>setSymbolTab("upload")} style={{padding:"8px 18px",fontFamily:"var(--mono)",fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.18em",border:"none",borderLeft:"1.5px solid var(--rule)",cursor:"pointer",background:symbolTab==="upload"?"var(--ink)":"var(--paper-4)",color:symbolTab==="upload"?"var(--paper-4)":"var(--ink-3)",transition:"all 140ms"}}>Upload Image</button>
        </div>
        {symbolTab==="preset"&&(
          <div className="symbol-picker">{SYMBOL_KEYS.map(k=>(<button key={k} type="button" className={"symbol-opt"+(!isCustomSymbol&&form.symbol===k?" selected":"")} onClick={()=>setForm(f=>({...f,symbol:k}))} title={k}><BallotSymbol name={k}/></button>))}</div>
        )}
        {symbolTab==="upload"&&(
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            <label htmlFor="symbol-upload-input" style={{cursor:"pointer"}}>
              <div className="image-slot" style={{width:100,height:100,borderRadius:2}}>
                {isCustomSymbol?<img src={form.symbol} alt="symbol" style={{width:"100%",height:"100%",objectFit:"contain"}}/>:<span style={{fontSize:11}}>Click to<br/>upload<br/>symbol</span>}
              </div>
            </label>
            <input id="symbol-upload-input" type="file" accept="image/*" onChange={handleSymbolUpload} style={{display:"none"}}/>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <div style={{fontFamily:"var(--mono)",fontSize:10,textTransform:"uppercase",letterSpacing:"0.14em",color:"var(--ink-3)"}}>Upload a PNG, JPG or SVG.<br/>Will appear on the ballot card.</div>
              {isCustomSymbol&&<button type="button" className="btn btn-sm" onClick={clearSymbolUpload} style={{borderColor:"var(--stamp)",color:"var(--stamp)",alignSelf:"flex-start"}}>✕ Remove</button>}
            </div>
          </div>
        )}
      </div>
    </Modal>
  );
};

const Results = ({ candidates, votes, houses, classes }) => {
  const [roleId,setRoleId]=useState(ROLES[0].id); const [scope,setScope]=useState("all");
  const role=ROLES.find(r=>r.id===roleId);
  const eligible=useMemo(()=>candidates.filter(c=>{if(c.role!==roleId)return false;if(role.scope==="house"&&scope!=="all"&&c.house!==scope)return false;if(role.scope==="class"&&scope!=="all"&&c.class!==scope)return false;return true;}),[candidates,roleId,scope,role]);
  const tally=useMemo(()=>{const t={};eligible.forEach(c=>t[c.id]=0);votes.forEach(v=>{const cid=v.picks[roleId];if(cid!=null&&t[cid]!=null)t[cid]++;});return t;},[votes,eligible,roleId]);
  const ranked=useMemo(()=>[...eligible].sort((a,b)=>(tally[b.id]||0)-(tally[a.id]||0)),[eligible,tally]);
  const totalVotes=Object.values(tally).reduce((s,n)=>s+n,0);
  return (<>
    <div className="admin-h"><div><h2>Live Results</h2><div className="desc">{totalVotes} votes counted</div></div><Chip variant="tick">Live</Chip></div>
    <div style={{display:"flex",gap:12,marginBottom:18,flexWrap:"wrap"}}>
      <div className="field"><label>Role</label><select className="input" value={roleId} onChange={e=>{setRoleId(e.target.value);setScope("all");}}>{ROLES.map(r=><option key={r.id} value={r.id}>{r.label}{r.gender?` (${r.gender})`:""}</option>)}</select></div>
      {role.scope==="house"&&<div className="field"><label>House</label><select className="input" value={scope} onChange={e=>setScope(e.target.value)}><option value="all">All Houses</option>{houses.map(h=><option key={h.id} value={h.id}>{h.name}</option>)}</select></div>}
      {role.scope==="class"&&<div className="field"><label>Class</label><select className="input" value={scope} onChange={e=>setScope(e.target.value)}><option value="all">All Classes</option>{classes.map(c=><option key={c} value={c}>Class {c}</option>)}</select></div>}
    </div>
    {role.scope!=="school"&&scope==="all"?(
      <div>{(role.scope==="house"?houses.map(h=>({id:h.id,label:h.name})):classes.map(c=>({id:c,label:"Class "+c}))).map(g=>{
        const gc=candidates.filter(c=>c.role===roleId&&(role.scope==="house"?c.house===g.id:c.class===g.id));
        const gt={};gc.forEach(c=>gt[c.id]=0);votes.forEach(v=>{const cid=v.picks[roleId];if(cid!=null&&gt[cid]!=null)gt[cid]++;});
        const gr=[...gc].sort((a,b)=>(gt[b.id]||0)-(gt[a.id]||0));
        const gT=Object.values(gt).reduce((s,n)=>s+n,0);
        return <ResultsGroup key={g.id} title={g.label} ranked={gr} tally={gt} leadId={gT?gr[0]?.id:null} total={gT}/>;
      })}</div>
    ):(
      <ResultsGroup title={role.label+(role.gender?` (${role.gender})`:"")} ranked={ranked} tally={tally} leadId={totalVotes?ranked[0]?.id:null} total={totalVotes}/>
    )}
  </>);
};

const ResultsGroup = ({ title, ranked, tally, leadId, total }) => (
  <div style={{marginBottom:26,border:"1.5px solid var(--rule)",background:"var(--paper)",padding:18}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
      <h3 style={{fontSize:22}}>{title}</h3>

      const n=tally[c.id]||0,pct=total?(n/total*100):0,isLead=c.id===leadId&&n>0;

);

    if(h.id&&houses.find(x=>x.id===h.id)){await sb.from("houses").update(row).eq("id",h.id);setHouses(prev=>prev.map(x=>x.id===h.id?{...x,...row}:x));}

};

const ExportAdmin = ({ candidates, votes, houses }) => {
  const dl=(filename,csv)=>{const blob=new Blob([csv],{type:"text/csv"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);};
  const votesCsv=()=>{
    const h=["timestamp","voter_name","class","house",...ROLES.map(r=>r.id+(r.gender?"_"+r.gender.toLowerCase():""))];
    const rows=votes.map(v=>[new Date(v.ts).toISOString(),v.voter_name,v.class,houses.find(h=>h.id===v.house)?.name||"",...ROLES.map(r=>{const c=candidates.find(c=>c.id===v.picks[r.id]);return c?c.name:"";})]);
    return[h,...rows].map(r=>r.map(x=>`"${(x??"").toString().replace(/"/g,'""')}"`).join(",")).join("\n");
  };
  const tallyCsv=()=>{
    const lines=[["role","house_or_class","candidate","symbol","votes"]];
    for(const r of ROLES){for(const c of candidates.filter(x=>x.role===r.id)){const n=votes.filter(v=>v.picks[r.id]===c.id).length;const scope=r.scope==="house"?houses.find(h=>h.id===c.house)?.name:r.scope==="class"?c.class:"school";lines.push([r.label+(r.gender?` (${r.gender})`:""),scope||"",c.name,c.symbol,n]);}}
    return lines.map(r=>r.map(x=>`"${(x??"").toString().replace(/"/g,'""')}"`).join(",")).join("\n");
  };
  return (<>
    <div className="admin-h"><div><h2>Export Records</h2><div className="desc">Generate CSV files for the school office</div></div></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      <div style={{border:"1.5px solid var(--rule)",background:"var(--paper)",padding:22}}><h3 style={{fontSize:22}}>Raw Ballot Log</h3><p style={{fontFamily:"var(--mono)",fontSize:11,textTransform:"uppercase",letterSpacing:"0.14em",color:"var(--ink-3)",margin:"6px 0 16px"}}>One row per cast ballot.</p><button className="btn btn-primary" onClick={()=>dl("dps-ballots.csv",votesCsv())}>Download CSV</button></div>
      <div style={{border:"1.5px solid var(--rule)",background:"var(--paper)",padding:22}}><h3 style={{fontSize:22}}>Tally Summary</h3><p style={{fontFamily:"var(--mono)",fontSize:11,textTransform:"uppercase",letterSpacing:"0.14em",color:"var(--ink-3)",margin:"6px 0 16px"}}>Vote totals per candidate.</p><button className="btn btn-primary" onClick={()=>dl("dps-tally.csv",tallyCsv())}>Download CSV</button></div>
    </div>
  </>);
};

// ─── Root App ─────────────────────────────────────────────────────────────────
const App = () => {
  const [route,setRoute]=useState("welcome");
  const [loading,setLoading]=useState(true);
  const [candidates,setCandidates]=useState([]);
  const [votes,setVotes]=useState([]);
  const [houses,setHouses]=useState([]);
  const [classes,setClasses]=useState([]);
  const [votingOpen,setVotingOpen]=useState(true);

  const loadAll=useCallback(async()=>{
    setLoading(true);
    const [ch,cc,ccand,cv,cs]=await Promise.all([
      sb.from("houses").select("*").order("name"),
      sb.from("classes").select("id").order("id"),
      sb.from("candidates").select("*").order("name"),
      sb.from("votes").select("*").order("ts"),
      sb.from("settings").select("*"),
    ]);
    if(ch.data) setHouses(ch.data);
    if(cc.data) setClasses(cc.data.map(r=>r.id));
    if(ccand.data) setCandidates(ccand.data);
    if(cv.data) setVotes(cv.data);
    if(cs.data){const vo=cs.data.find(s=>s.key==="voting_open");if(vo)setVotingOpen(vo.value===true||vo.value==="true");}
    setLoading(false);
  },[]);

  useEffect(()=>{loadAll();},[loadAll]);

  // Realtime subscriptions
  useEffect(()=>{
    const ch=sb.channel("realtime-dps")
      .on("postgres_changes",{event:"*",schema:"public",table:"votes"},payload=>{
        if(payload.eventType==="INSERT") setVotes(prev=>[...prev,payload.new]);
        else if(payload.eventType==="DELETE") setVotes(prev=>prev.filter(v=>v.id!==payload.old.id));
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"settings"},payload=>{
        if(payload.new?.key==="voting_open") setVotingOpen(payload.new.value===true||payload.new.value==="true");
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"candidates"},()=>{ sb.from("candidates").select("*").order("name").then(({data})=>{if(data)setCandidates(data);}); })
      .subscribe();
    return()=>sb.removeChannel(ch);
  },[]);

  const checkHasVoted=async(name,klass)=>{
    const {data}=await sb.from("votes").select("id").ilike("voter_name",name).eq("class",klass).limit(1);
    return data&&data.length>0;
  };

  const handleSubmitVote=async(vote)=>{
    const{data}=await sb.from("votes").insert(vote).select().single();
    if(data) setVotes(prev=>[...prev,data]);
  };

  const ArrowIco=()=><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>;

  if(loading) return <LoadingOverlay msg="Connecting to Supabase…"/>;

  return (<>
    <Letterhead subtitle="Student Council Election — 2026" right={route!=="welcome"&&(
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <Chip variant={votingOpen?"tick":"stamp"}>{votingOpen?"Polls Open":"Polls Closed"}</Chip>
        <button className="btn btn-sm" onClick={()=>setRoute("welcome")}>
          <svg className="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12L12 3l9 9M5 10v10h14V10"/></svg>Home
        </button>
      </div>
    )}/>

    {route==="welcome"&&(
      <div className="welcome">
        <div className="welcome-card">
          <SheetCorners/><Watermark text="DPS BIRATNAGAR · OFFICIAL BALLOT"/>
          <div className="welcome-inner">
            <div className="welcome-eyebrow">Office of the Returning Officer</div>
            <h1>Student Council<br/>Election &mdash; 2026</h1>
            <p className="scroll">You are entering the official polling system of <strong>DPS Biratnagar</strong>.<br/>Choose your entry below. All ballots cast are sealed and final.</p>
            <RuleOrn/>
            <div className="welcome-actions">
              <button className="action-card" onClick={()=>setRoute("student")}>
                <div className="ac-eye">Booth · A</div><div className="ac-h">Cast My Ballot</div>
                <div className="ac-desc">Enter the polling booth as a student. Identity → House → Seven ballots.</div>
                <div className="ac-arrow"><ArrowIco/></div>
              </button>
              <button className="action-card" onClick={()=>setRoute("adminLock")}>
                <div className="ac-eye">Booth · B</div><div className="ac-h">Returning Officer</div>
                <div className="ac-desc">Manage candidates, monitor live results, export records and open/close polls.</div>
                <div className="ac-arrow"><ArrowIco/></div>
              </button>
            </div>
            <div style={{marginTop:32,fontFamily:"var(--mono)",fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.24em",color:"var(--ink-3)",display:"inline-flex",alignItems:"center",gap:10}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:votingOpen?"var(--tick)":"var(--stamp)",boxShadow:`0 0 0 4px ${votingOpen?"rgba(31,111,67,0.15)":"rgba(139,31,47,0.15)"}`}}/>
              {votingOpen?"Polls are presently open · Identification required":"Polls are presently closed"}
            </div>
          </div>
        </div>
      </div>
    )}

    {route==="adminLock"&&<AdminLock onUnlock={()=>setRoute("admin")}/>}

    {route==="student"&&<StudentApp candidates={candidates} houses={houses} classes={classes} votingOpen={votingOpen} onSubmitVote={handleSubmitVote} checkHasVoted={checkHasVoted}/>}

    {route==="admin"&&<AdminApp candidates={candidates} setCandidates={setCandidates} votes={votes} setVotes={setVotes} houses={houses} setHouses={setHouses} classes={classes} setClasses={setClasses} votingOpen={votingOpen} setVotingOpen={setVotingOpen} reload={loadAll}/>}
  </>);
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
